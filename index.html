<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Signal Path — Sound Design Tutor Synth</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">◎</span>
      <h1>Signal Path <span class="brand-sub">— a synth that explains itself</span></h1>
    </div>
    <div id="mcp-status" class="mcp-status mcp-status--off">
      <span class="dot"></span>
      <span class="label">WebMCP: checking…</span>
    </div>
  </header>

  <section class="presets-row">
    <span class="presets-label">Start here</span>
    <div id="presets" class="presets"></div>
    <button id="surprise-btn" class="surprise-btn">🎲 Surprise me</button>
  </section>

  <main class="signal-path" id="signal-path">
    <!-- oscillator, filter, envelope, effect, output modules injected by ui.js,
         each separated by an animated "cable" connector -->
  </main>

  <section class="panel reasoning-log">
    <h2>Reasoning Log</h2>
    <p class="hint">Ask the agent for a sound (e.g. "make it warmer") and the last few changes with their explanations build up here.</p>
    <ul id="reasoning-log-list"></ul>
  </section>

  <section class="keyboard-panel">
    <h2>
      Keyboard
      <span class="hint">(click any key, or type A S D F G H J K / W E T Y U — Z/X shifts octave)</span>
      <span id="octave-indicator" class="octave-indicator"></span>
    </h2>
    <div id="keyboard-scroll" class="keyboard-scroll">
      <div id="keyboard" class="keyboard"></div>
    </div>
  </section>

  <script src="js/knob.js"></script>
  <script src="js/presets.js"></script>
  <script src="js/audio-engine.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/webmcp-tools.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
